networks:
  dev:
services:
  # nginx:
  #   image: nginx:stable-alpine
  #   ports:
  #     # - "80:80"
  #     - '443:443'
  #   volumes:
  #     - './nginx.conf:etc/nginx/nginx.conf'
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - dev
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - DB_NAME=pern_project
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_HOST=postgres
      - DB_PORT=5432
      - PORT=5000
      # - DB_HOST=host.docker.internal
      # - DB_NAME=pern_project
      # - DB_PORT=5432
      # - DB_USER=postgres
      # - DB_PASSWORD=root
      # - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/db
    ports:
      - '5000:5000'
    depends_on:
      - postgres
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - dev
  # frontend:
  #   build:
  #     context: ./client
  #     dockerfile: Dockerfile
  #   ports:
  #     - '3000:3000'
  #   depends_on:
  #     - postgres
  #   volumes:
  #     - .:/usr/src/app
  #     - /usr/src/app/node_modules
  #   networks:
  #     - dev
  postgres:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=pern_project
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_HOST_AUTH_METHOD=trust
      # - POSTGRES_DB=${DB_NAME}
      # - POSTGRES_USER=${DB_USER}
      # - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dev

volumes:
  pgdata:

