# version: '3.8'

networks:
  dev:

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - DB_NAME=pern_project
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - dev

  postgres:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=pern_project
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_HOST_AUTH_METHOD=trust
    restart: always
    networks:
      - dev

